name: worker-day-offline
on:
  pull_request:
    paths:
      - 'public/**'
      - 'app/worker-day.tsx'
      - 'tests/worker-day-offline-contract.mjs'
      - 'tests/smoke/worker-day-offline-browser.mjs'
      - 'docs/current/worker-day-offline/**'
      - '.github/workflows/worker-day-offline.yml'
permissions:
  contents: read
concurrency:
  group: worker-day-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact branch source
        env:
          SAHA_BROWSER_PACKAGE: '@playwright/test'
        run: bash docs/current/worker-day-offline/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-day-offline-evidence
          path: tests/reports/
          retention-days: 14
