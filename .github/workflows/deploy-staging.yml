# Hosted synthetic staging (sponsor instruction, 1 October 2026): every merge into main is built,
# checked and deployed to the Cloudflare Worker named in deploy/cloudflare-staging.json, behind
# Cloudflare Access. Synthetic data only; external APIs stay off; not accepted for real patient use.
# Without the CLOUDFLARE_API_TOKEN repository secret the job deploys nothing.
name: deploy-staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Deploy credentials present
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; nothing was deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 22
      - name: Account
        if: steps.creds.outputs.configured == 'true'
        run: |
          id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('deploy/cloudflare-staging.json','utf8')).accountId||'')")
          if [ -n "$id" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"; fi
      - name: Documentation and requirements integrity
        if: steps.creds.outputs.configured == 'true'
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      - name: Install pinned dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm run install:ci
      - name: Type check and build
        if: steps.creds.outputs.configured == 'true'
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          npm run build
      - name: Supply-chain gate
        if: steps.creds.outputs.configured == 'true'
        run: node scripts/security-gate.mjs
      - name: Staging database
        if: steps.creds.outputs.configured == 'true'
        run: node scripts/cloudflare-staging.mjs database
      - name: Hosted Worker configuration
        if: steps.creds.outputs.configured == 'true'
        run: node scripts/cloudflare-staging.mjs configure
      - name: Apply new database migrations
        if: steps.creds.outputs.configured == 'true'
        run: node node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        run: |
          node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
          echo "### Deployed $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Live site requires sign-in
        if: steps.creds.outputs.configured == 'true'
        run: |
          sleep 10
          node scripts/cloudflare-staging.mjs check "$STAGING_URL"
