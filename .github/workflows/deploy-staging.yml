# Hosted synthetic staging (sponsor instruction, 1 October 2026): every merge into main is built,
# checked and deployed to the Cloudflare Worker named in deploy/cloudflare-staging.json, behind
# Cloudflare Access. Synthetic data only; external APIs stay off; not accepted for real patient use.
# Without the CLOUDFLARE_API_TOKEN repository secret the job deploys nothing. While the repository
# variable SAHA_DEPLOY_FREEZE is true, a push skips the job before a runner starts (slice 9c).
# A hand-started run still deploys. Secrets cannot be read in that job condition, so a missing token
# is still reported by the first step.
name: deploy-staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Push deploys cancel an older push deploy. A hand-started run uses its own group, so a merge
  # does not cancel a demonstration deploy started from a chosen tag.
  group: deploy-staging-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  deploy:
    # vars.SAHA_DEPLOY_FREEZE is the repository Actions variable. Unset or any value other than true
    # still deploys on push. workflow_dispatch deploys even while the variable is true.
    if: github.event_name == 'workflow_dispatch' || vars.SAHA_DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Deploy credentials present
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; nothing was deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 22
      - name: Account
        if: steps.creds.outputs.configured == 'true'
        run: |
          id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('deploy/cloudflare-staging.json','utf8')).accountId||'')")
          if [ -n "$id" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"; fi
      - name: Documentation and requirements integrity
        if: steps.creds.outputs.configured == 'true'
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      - name: Install pinned dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm run install:ci
      - name: Type check and build
        if: steps.creds.outputs.configured == 'true'
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          npm run build
      - name: Supply-chain gate
        if: steps.creds.outputs.configured == 'true'
        run: node scripts/security-gate.mjs
      - name: Staging database
        if: steps.creds.outputs.configured == 'true'
        run: node scripts/cloudflare-staging.mjs database
      - name: Hosted Worker configuration
        if: steps.creds.outputs.configured == 'true'
        run: node scripts/cloudflare-staging.mjs configure
      - name: Apply new database migrations
        if: steps.creds.outputs.configured == 'true'
        run: node node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        run: |
          node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
          echo "### Deployed $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Live site requires sign-in
        if: steps.creds.outputs.configured == 'true'
        run: |
          sleep 10
          node scripts/cloudflare-staging.mjs check "$STAGING_URL"
      # Slice 11f: post-deploy smoke (tests/smoke/hosted-smoke.mjs, slice 11b). Without a Cloudflare Access service token it checks
      # only what an anonymous visitor may see (Access redirect, forged identity headers refused, TLS, response headers); with
      # CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET repository secrets it also reports how the app answers the service token.
      # Exit 1 (a check failed) fails the job; exit 2 (the site could not be reached) is a warning, not a pass.
      - name: Hosted smoke
        if: steps.creds.outputs.configured == 'true'
        env:
          SAHA_HOSTED_URL: ${{ env.STAGING_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +e
          node tests/smoke/hosted-smoke.mjs; code=$?
          if [ "$code" = "2" ]; then echo "::warning::Hosted smoke could not reach $SAHA_HOSTED_URL; nothing was checked."; exit 0; fi
          exit $code
