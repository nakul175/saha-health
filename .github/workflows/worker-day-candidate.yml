name: worker-day-candidate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/worker-day*'
      - 'app/workspace.tsx'
      - 'lib/saha/worker-day.ts'
      - 'tests/worker-day-contract.mjs'
      - 'tests/smoke/worker-day-browser.mjs'
      - 'docs/current/worker-day-delivery/**'
      - '.github/workflows/worker-day-candidate.yml'
permissions:
  contents: read
concurrency:
  group: worker-day-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'nakul175/saha-health' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/worker-day-2026-10-09' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wire reviewed source and preserve baseline on this branch only
        id: prepare
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! grep -Fq "import { WorkerToday, WorkerNavigation, WorkerSpace }" app/workspace.tsx; then
            python3 docs/current/worker-day-delivery/apply.py
          fi
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
          git add app/workspace.tsx docs VALIDATION.md HANDOVER.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: wire reviewed worker-day entry and retain source evidence'
            REMOTE="$(git ls-remote origin refs/heads/feat/worker-day-2026-10-09 | cut -f1)"
            test "$REMOTE" = "$EXPECTED_HEAD" || { echo 'Branch moved; refusing to overwrite concurrent work.'; exit 1; }
            git push origin HEAD:refs/heads/feat/worker-day-2026-10-09
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/worker-day-source
          git rev-parse HEAD > /tmp/worker-day-source/source-commit.txt
          python3 - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          names=subprocess.check_output(['git','diff','--name-only','43f445acf4c54352cd2084e0bcd88bfbf605d757','HEAD'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/worker-day-source/changes.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=Path(name)
                  if p.is_file(): z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worker-day-candidate-source
          path: /tmp/worker-day-source/
          retention-days: 7
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrity and original requirement register
        id: integrity
        continue-on-error: true
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        id: dependencies
        continue-on-error: true
        run: npm run install:ci
      - name: Lint ratchet and types
        id: static
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          npm run lint:baseline
          npm run typecheck
      - name: Build exact candidate
        id: build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Browser installation
        id: chromium
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Worker-day pure contract
        id: contract
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: node scripts/test.mjs unit --only unit/worker-day-contract --fast --guard
      - name: Today to real synthetic saved draft
        id: journey
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        env:
          SAHA_BROWSER_PACKAGE: '@playwright/test'
        run: node scripts/test.mjs smoke --only smoke/worker-day-browser --fast --guard
      - name: Existing security gate
        id: security
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/security-gate.mjs
      - name: Existing HTTP and recovery regressions
        id: integration
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/test.mjs integration resilience --only integration/run-api-smoke,resilience/recovery-drill --fast --guard
      - name: Record exact candidate outcomes
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          steps=json.loads(os.environ['OUTCOMES'])
          names=['integrity','dependencies','static','build','chromium','contract','journey','security','integration']
          r={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'outcomes':{n:steps.get(n,{}).get('outcome','not-run') for n in names},'boundary':'Candidate engineering evidence only; no deployment, physical handset, ASHA, clinical or programme acceptance.'}
          Path('tests/reports').mkdir(parents=True,exist_ok=True)
          Path('tests/reports/worker-day-outcomes.json').write_text(json.dumps(r,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Candidate '+r['commit']+'\n\n'+''.join('- '+k+': '+v+'\n' for k,v in r['outcomes'].items()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-day-candidate-results
          path: |
            tests/reports/
            dist/security-gate.json
          retention-days: 7
      - name: Require every selected check
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('tests/reports/worker-day-outcomes.json')
          if not p.exists(): sys.exit(1)
          sys.exit(int(any(v!='success' for v in json.loads(p.read_text())['outcomes'].values())))
          PY
