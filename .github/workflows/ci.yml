# Slice 0c: engineering CI on synthetic data only. It never uses secrets, live providers,
# hosted databases or real patient records, and it does not deploy the Site.
name: engineering-checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs before install and tests, which rewrite checkout-local files and result reports.
      - name: Documentation and requirements integrity
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build
        run: npm run build
      - name: Supply-chain gate (SBOM and audit)
        run: node scripts/security-gate.mjs
      - name: Disposable local database
        run: |
          for m in drizzle/[0-9][0-9][0-9][0-9]_*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/test-state --file "$m"
          done
      - name: HTTP and database suite
        run: node tests/run-api-smoke.mjs
      - name: Contract suites
        run: for t in read-audit-completion-contract identifier-crosswalk-contract incentive-claims-contract workforce-import-contract household-visit-contract send-gate-contract visit-import-contract i18n-contract demonstration-contract tenth-review-fixes-contract ninth-review-fixes-contract eighth-review-fixes-contract caseload-schedule-contract indicator-freshness-contract aggregate-delivery-contract correction-tasks-contract sixth-review-fixes-contract seventh-review-fixes-contract replay-soak-contract ehr-resolution-contract adapter-operations-contract value-override-contract value-override-agent-contract field-units-client fifth-review-fixes-contract fourth-review-fixes-contract pack-installation-contract alert-delivery-contract notification-channel-contract note-answer-signoff-contract access-audit-contract indicator-registry-contract cloudflare-staging-contract programme-migration-contract main-review-fixes-contract review-fixes-contract drift-contract ai-invoice-contract plan-dependencies-contract patient-import-contract record-import-contract fact-verification-contract field-capacity-client field-media-capacity-client referral-request-queue-contract patient-directory-contract worklists-contract agent-contract task-limits-contract shadow-contract provider-history-contract provider-sandbox-contract agent-quality-contract capability-lifecycle-contract action-plan-contract exceptions-contract trace-contract report-export-contract audit-chain-contract ai-budget-contract safe-logs-contract data-exit-contract environment-contract fixture-migration-contract consent-contract delegation-contract worker-activity-contract continuity-contract ehr-contract ehr-execution field-client field-media-client field-storage-client field-recording-client field-registration-client field-provenance-client fhir-validate-contract fact-provenance-contract alerts-contract photo-contract field-contract field-shell governance-contract mis-contract mis-delivery operations-contract outreach-contract pilot-contract storage-contract identity-contract household-contract caseload-contract merge-contract exceptional-contract rights-contract scoped-read-contract retention-contract indicators-contract referral-contract reuse-contract roster-contract abdm-contract abdm-transfer-contract media-contract; do node tests/$t.mjs; done
      - name: Encrypted restore drill
        run: node tests/recovery-drill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            tests/*-result.json
            dist/sbom.cdx.json
            dist/security-gate.json
