# Slice 0c: engineering CI on synthetic data only. It never uses secrets, live providers,
# hosted databases or real patient records, and it does not deploy the Site.
name: engineering-checks
on:
  pull_request:
    # A pull request that changes only Markdown or docs/ does not start this suite.
    # Any other path still runs it, including the documentation integrity step.
    # workflow_dispatch always runs the full suite.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs before install and tests, which rewrite checkout-local files and result reports.
      - name: Documentation and requirements integrity
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      # Slice 11a: fails when a test file is not classified into a layer, or a *-smoke.mjs module is not imported by tests/api-smoke.mjs.
      - name: Test catalogue
        run: node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build
        run: npm run build
      - name: Supply-chain gate (SBOM and audit)
        run: node scripts/security-gate.mjs
      - name: Disposable local database
        run: |
          for m in drizzle/[0-9][0-9][0-9][0-9]_*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/test-state --file "$m"
          done
      - name: HTTP and database suite
        run: node tests/run-api-smoke.mjs
      # Slice 11a: the runner finds every unit suite itself (tests/*-contract.mjs, *-client.mjs and three named suites), so a
      # new suite is never left out of CI. --guard fails when a suite reports fewer passed assertions than tests/regression-baseline.json.
      - name: Unit suites
        run: node scripts/test.mjs unit --guard
      - name: Encrypted restore drill
        run: node tests/recovery-drill.mjs
      # Slice 11a: smoke suites under tests/smoke/ (each starts its own local Worker with fresh synthetic state). Reports "not present" when there are none.
      - name: Smoke suites
        run: node scripts/test.mjs smoke --fast
      # Slice 11f: the two security suites run on every pull request (about 2 minutes): the authorisation matrix over every
      # GET route and role, and identity hardening under Cloudflare Access (signed, forged and fixture principals). The UAT
      # register check and the drift checks of the generated UAT pack and coverage map take seconds.
      - name: Security suites and UAT checks
        run: node scripts/test.mjs nfr uat --only nfr/authorisation-matrix,nfr/identity-hardening,uat/check-uat-register,uat/generate-uat-pack,uat/coverage-map --fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            tests/*-result.json
            tests/reports/
            dist/sbom.cdx.json
            dist/security-gate.json
