# Slice 0c: engineering CI on synthetic data only. It never uses secrets, live providers,
# hosted databases or real patient records, and it does not deploy the Site.
name: engineering-checks
on:
  pull_request:
    # A pull request that changes only Markdown or docs/ does not start this suite.
    # Any other path still runs it, including the documentation integrity step.
    # workflow_dispatch always runs the full suite.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs before install and tests, which rewrite checkout-local files and result reports.
      - name: Documentation and requirements integrity
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      # Slice 11a: fails when a test file is not classified into a layer, or a *-smoke.mjs module is not imported by tests/api-smoke.mjs.
      - name: Test catalogue
        run: node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      # Wave 0 hygiene gates (8 October 2026). The lint ratchet compares the ESLint error count with .lint-baseline.json and
      # fails only when it rises; lower the baseline with `node scripts/lint-baseline.mjs --update` after fixing problems.
      # Both run through the package scripts (`npm run`, because install:ci puts pnpm behind corepack, not on PATH).
      - name: Lint (ratchet against .lint-baseline.json)
        run: npm run lint:baseline
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: D02 real synthetic Today journey
        run: |
          npx playwright install --with-deps chromium
          node scripts/test.mjs smoke --only smoke/today-browser --fast --guard
      - name: D03 routine capture and current-authority regression
        run: node scripts/test.mjs integration smoke --only integration/routine-authority-http,integration/routine-organisation-http,integration/routine-attempt-browser,smoke/routine-visit-browser,integration/routine-telemetry-retention-http --fast --guard
      - name: Supply-chain gate (SBOM and audit)
        run: node scripts/security-gate.mjs
      - name: Next-50 bounded integration regressions
        env:
          SAHA_TEST_PORT: '9493'
        run: node scripts/test.mjs integration nfr smoke --only integration/routine-save-status-browser,nfr/identity-numeric-dates,smoke/task-entry-browser,smoke/programme-status-browser,smoke/handover-browser,smoke/resume-work-browser --fast --guard --report tests/reports/next50-208-216-ci-summary.json
      - name: Explicit existing-record matching and same-snapshot purpose
        env:
          SAHA_TEST_PORT: '21827'
          SAHA_MATCHING_OUTPUT: tests/reports/record-matching-ci
        run: node scripts/test.mjs smoke --only smoke/record-matching-browser --fast --guard --report tests/reports/record-matching-ci-summary.json
      - name: Original fact time and configured relevance review
        env:
          SAHA_TEST_PORT: '21865'
          SAHA_FRESHNESS_OUTPUT: tests/reports/fact-freshness-ci
        run: node scripts/test.mjs smoke --only smoke/fact-freshness-browser --fast --guard --report tests/reports/fact-freshness-ci-summary.json
      - name: Strict calendar minute native21 control
        run: node scripts/test.mjs smoke --only smoke/observation-time-browser --fast --guard --report tests/reports/observation-time-current-summary.json
      - name: Assigned ASHA traceable correction draft and exact-attempt recovery
        env:
          SAHA_TEST_PORT: '21783'
          SAHA_AMENDMENTS_OUTPUT: tests/reports/amendments-ci
        run: node scripts/test.mjs smoke --only smoke/amendments-browser --fast --guard --report tests/reports/amendments-ci-summary.json
      - name: Own assistance status and explicit local cancellation
        env:
          SAHA_TEST_PORT: '21835'
          SAHA_ASSISTANCE_OUTPUT: tests/reports/assistance-control-ci
        run: node scripts/test.mjs smoke --only smoke/assistance-control-browser --fast --guard --report tests/reports/assistance-control-ci-summary.json
      - name: Existing-owner suspension and receipt-only recovery
        env:
          SAHA_TEST_PORT: '21903'
          SAHA_WORKFORCE_OUTPUT: tests/reports/workforce-status-ci
        run: node scripts/test.mjs smoke --only smoke/workforce-status-browser --fast --guard --report tests/reports/workforce-status-ci-summary.json
      - name: Next-50 bounded review integration regressions
        env:
          SAHA_TEST_PORT: '9517'
        run: node scripts/test.mjs smoke --only smoke/programme-pack-review-browser,smoke/service-authority-review-browser,smoke/household-proxy-review-browser,smoke/interface-language-browser,smoke/institution-roster-review-browser,smoke/deployment-evidence-review-browser,smoke/own-care-permissions-browser,smoke/selective-reuse-browser --fast --guard --report tests/reports/next50-225-232-ci-summary.json
      # Slice 11g (test review M7, H1): every suite runs through scripts/test.mjs. It builds the HTTP suite's local D1 in one
      # wrangler call (one process per migration failed 4 of 6 trials on a loaded machine), runs the restore drill on the
      # database the HTTP suite populated, and --guard fails when a suite disappears or reports fewer passed assertions than
      # tests/regression-baseline.json.
      - name: HTTP and database suite, restore drill
        run: node scripts/test.mjs integration resilience --only integration/run-api-smoke,resilience/recovery-drill --fast --guard
      # Slice 11a: the runner finds every unit suite itself, so a new suite is never left out of CI.
      - name: Unit suites
        run: node scripts/test.mjs unit --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            tests/*-result.json
            tests/reports/
            dist/sbom.cdx.json
            dist/security-gate.json
            dist/bundle-provenance-evidence.json

  # Split from `checks` on 6 October 2026: the browser regressions plus smoke selection no longer fit the 30-minute hosted limit
  # together with the unit and API layers. The selections, guards and baseline are unchanged; both jobs must pass.
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Install Chromium for app-first regressions
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: App-first workflow and scope regressions
        env:
          # These two household suites include a phone journey only with an explicit browser module.
          # CI must run the same counted journey as the integrated local regression gate.
          SAHA_BROWSER_PACKAGE: '@playwright/test'
        run: node scripts/test.mjs integration smoke ui --only integration/app-offline-review-browser,integration/app-offline-scope-browser,integration/touch-units-browser,integration/app-offline-browser,integration/service-identity-management,integration/reconciliation-http,integration/reminder-optout-http,integration/auxiliary-read-http,integration/workspace-metadata-smoke,integration/range-protocol-browser,integration/range-first-tap-browser,integration/import-unit-parity-browser,integration/offline-programme-browser,integration/delta-read-audit-http,integration/command-authority-http,integration/device-work-browser,integration/device-work-purge-failure-browser,integration/work-burden-http,integration/work-burden-browser,integration/work-burden-field-http,integration/work-burden-field-browser,integration/registration-device-browser,integration/work-burden-account-transition-review-browser,integration/registration-wire-receipt-http,integration/work-burden-ledger-http,integration/work-burden-ledger-browser,integration/work-burden-auth-first-http,integration/work-burden-transport-http,integration/work-support-visibility-http,integration/offline-opens-auth-first-http,integration/offline-opens-http,integration/offline-opens-browser,integration/offline-open-account-binding-browser,integration/offline-open-unsent-pruning-browser,integration/work-burden-field-continuation-http,integration/work-burden-field-hooks-browser,integration/work-burden-field-identity-review,integration/work-burden-continuation-phone-review,integration/work-burden-continuation-adversarial-review,integration/clinical-source-http,integration/clinical-source-browser,integration/clinical-source-identity-http,integration/clinical-source-retrieval-http,integration/clinical-source-retrieval-browser,integration/clinical-source-dependency-http,integration/offline-opens-transport-http,integration/household-reschedule-http,integration/household-reschedule-independent-http,integration/contact-import-http,integration/contact-import-independent-review,integration/mapping-lifecycle-http,integration/mapping-lifecycle-review-http,integration/mapping-lifecycle-browser,integration/mapping-lifecycle-review-browser,integration/indicator-governance-http,integration/indicator-governance-clock-http,integration/indicator-governance-browser,integration/indicator-governance-independent-http,integration/indicator-figures-http,integration/indicator-figures-edition-http,integration/indicator-figures-browser,integration/indicator-figures-submission-http,integration/indicator-figures-review-authority,integration/indicator-figures-review-submission,integration/inbound-conflicts-http,integration/inbound-conflicts-browser,integration/inbound-conflicts-pressure-repair,integration/inbound-conflicts-transport-http,integration/inbound-conflicts-independent-authority,integration/inbound-conflicts-independent-handoff,integration/household-completion-http,integration/household-completion-browser,integration/household-completion-independent-http,integration/household-completion-authority-review,integration/indicator-figures-submission-independent,integration/report-portability-http,integration/report-portability-after-http,integration/composite-measures-http,integration/composite-measures-browser,integration/composite-authority-repair-http,integration/composite-authority-independent-extra-http,integration/guided-home-browser,integration/inbound-retrieval-http,integration/inbound-retrieval-browser,integration/inbound-retrieval-service-repair-http,integration/inbound-retrieval-after-http,integration/inbound-retrieval-after-browser,integration/inbound-retrieval-original-race-after,integration/inbound-retrieval-service-independent-http,integration/mapping-conformance-http,integration/mapping-conformance-browser,integration/mapping-conformance-independent-http,integration/imported-evidence-http,integration/imported-evidence-browser,integration/imported-evidence-independent-http,integration/imported-evidence-independent-browser,ui/availability,smoke/app-back-browser,smoke/reconciliation-ui,smoke/reminder-optout-refresh-browser,integration/asha-guided-capture-browser,integration/asha-guided-capture-conditional,integration/asha-guided-capture-legacy-range,integration/asha-guided-capture-uncertainty,integration/figure-impact-browser,integration/figure-impact-http,integration/figure-impact-independent-extra-http,integration/guided-programme-reset-original-probe,integration/guided-programme-reset-variants,integration/guided-repair-independent-probe,integration/object-media-browser,integration/object-media-budget-http,integration/object-media-http,integration/object-media-independent-extra-http,integration/object-media-independent-storage-boundary,integration/object-media-legacy-regression,integration/object-media-migration,integration/object-media-native-boundary,integration/imported-media-independent-probe,integration/offline-guided-author-browser,integration/offline-sync-hash-repair-browser,integration/offline-sync-hash-device-browser,integration/offline-sync-hash-cold-extra-browser,integration/sync-receipt-cold-scope-browser,integration/programme-raw-key-http,integration/programme-raw-key-original-probe,integration/raw-key-independent-authority-http,integration/reporting-completeness-repaired-http,integration/reporting-completeness-repaired-browser,integration/reporting-completeness-repaired-account-browser,integration/completeness-cold-extra-authority-http,integration/completeness-cold-extra-browser,integration/installed-programme-execution-http,integration/installed-programme-execution-extra-http,integration/installed-programme-execution-browser,integration/verification-send-http,integration/verification-send-legacy-http,integration/verification-send-browser,integration/verification-send-extra-http,integration/verification-send-uncertainty-browser,integration/operational-privacy-http,integration/operational-privacy-adverse-http,integration/operational-privacy-browser,integration/operational-privacy-extra-http,integration/guided-registration-browser,integration/guided-registration-overflow-browser,integration/guided-registration-root-independent-browser --fast --guard
      # Slices 11b and 11f: local smoke and the hosted smoke's self-test; the authorisation matrix over every GET route and role,
      # and identity hardening under Cloudflare Access; the UAT register check and the drift checks of the generated documents.
      - name: Smoke, security suites and UAT checks
        run: node scripts/test.mjs smoke nfr uat --only smoke/routine-visit-browser,smoke/today-browser,smoke/local-smoke,smoke/hosted-smoke,nfr/authorisation-matrix,nfr/identity-hardening,uat/check-uat-register,uat/generate-uat-pack,uat/coverage-map --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-regression-evidence
          path: |
            tests/*-result.json
            tests/reports/
            dist/sbom.cdx.json
            dist/security-gate.json
            dist/bundle-provenance-evidence.json

  # Actual unchanged synthetic load guard on an isolated hosted runner; does not deploy or use secrets.
  bounded-report-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Documentation and catalogue integrity
        run: |
          python3 scripts/check-documentation.py
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build actual candidate Worker
        run: npm run build
      - name: Bounded pre-alert recovery contract
        run: node scripts/test.mjs unit --only unit/operations-pre-alert-recovery-contract --fast --guard
      - name: Actual native runtime log observation control
        run: node tests/native-runtime-log-probe-v2.mjs
      - name: Original400-slot load and unchanged13-check guard
        env:
          SAHA_TEST_PORT: '8832'
          SAHA_NFR_TRACE_DIR: tests/reports/report-load-current-candidate
        run: node scripts/test.mjs nfr --only nfr/load-burst --fast --guard --report tests/reports/report-load-current-candidate-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-report-load-evidence
          path: tests/reports/

  # Native security fixture executes independently even when another regression fails; no retries or deployment.
  native-authorization-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Documentation and test catalogue
        run: |
          python3 scripts/check-documentation.py
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build real current Worker
        run: npm run build
      - name: Original authorization matrix and unchanged minimum
        run: node scripts/test.mjs nfr --only nfr/authorisation-matrix --fast --guard --report tests/reports/native-authorization-current-summary.json
      - name: Original reporting calendar timing control
        run: node scripts/test.mjs integration --only integration/reporting-completeness-repaired-http --fast --guard --report tests/reports/reporting-calendar-current-summary.json
      - name: Install Chromium for original native phone controls
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Original installed-programme phone and device privacy controls
        run: node scripts/test.mjs integration --only integration/installed-programme-execution-browser,integration/device-work-browser --fast --guard --report tests/reports/native-programme-device-current-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-authorization-current-evidence
          path: tests/reports/

  original-backend-nfr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current source and original catalogue
        run: |
          python3 scripts/check-documentation.py
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build actual candidate Worker
        run: npm run build
      - name: Original backend performance and no-inspector memory controls
        run: node scripts/test.mjs nfr --only nfr/performance-budgets,nfr/memory-growth --fast --guard --report tests/reports/original-backend-nfr-current-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-backend-nfr-current-evidence
          path: tests/reports/

  # Additive diagnostic lane; the complete existing jobs and original eleven-group guard stay mandatory.
  availability-fixture-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Original documentation and requirements
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
      - name: Original pinned install
        run: npm run install:ci
      - name: Canonical build
        run: npm run build
      - name: Chromium
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Original eleven availability groups
        env:
          SAHA_BROWSER_PACKAGE: '@playwright/test'
        run: node scripts/test.mjs ui --only ui/availability --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: availability-fixture-diagnostic-evidence
          path: |
            tests/reports/availability-fixture/
            tests/reports/summary.json
            tests/reports/results/ui__availability.json
            tests/reports/logs/ui__availability.log
            tests/evidence/availability/
          if-no-files-found: error


  # Additive coverage of thirteen preserved original suites previously omitted from explicit CI.
  # Test failures remain failures, including existing privacy/count and screenshot-oracle conflicts.
  original-missing-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAHA_BROWSER_PACKAGE: '@playwright/test'
      SAHA_MISSING13_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Original documentation, requirements and catalogue
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
      - name: Capture exact source before installation
        run: |
          printf 'SAHA_LEGACY_WORK=%s/saha-original-missing13-legacy\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p tests/reports/original-missing13-custody
          git fetch --no-tags origin "$SAHA_MISSING13_CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$SAHA_MISSING13_CANDIDATE^{tree}")"
          cat > tests/reports/original-missing13-custody/capture.py <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          out = root / 'tests/reports/original-missing13-custody'
          out.mkdir(parents=True, exist_ok=True)
          phase = sys.argv[1]
          assert phase in ('before-install', 'built-current', 'final')
          def git(*args):
              p = subprocess.run(['git', *args], check=True, capture_output=True, timeout=20)
              assert len(p.stdout) <= 16 * 1024 * 1024, 'Git metadata exceeds explicit 16 MiB budget'
              return p.stdout
          def pin(path):
              if path.is_symlink():
                  target = os.readlink(path)
                  return {'kind': 'symlink', 'target': target, 'sha256': hashlib.sha256(os.fsencode(target)).hexdigest()}
              data = path.read_bytes()
              return {'kind': 'file', 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          names = [os.fsdecode(p) for p in git('ls-files', '-z').split(b'\0') if p]
          inputs = {}
          for name in names:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              inputs[name] = pin(root / name)
          dist = {}
          if (root / 'dist').exists():
              for p in sorted((root / 'dist').rglob('*')):
                  if p.is_file() or p.is_symlink():
                      dist[p.relative_to(root).as_posix()] = pin(p)
          receipts = {}
          for p in sorted((root / '.sites-runtime/bundle-provenance').glob('*.json')):
              data = p.read_bytes()
              receipts[p.name] = {'sha256': hashlib.sha256(data).hexdigest(), 'receipt': json.loads(data)}
          baseline = json.loads((root / 'tests/regression-baseline.json').read_text())
          record = {'schema': 1, 'phase': phase, 'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'head': git('rev-parse', 'HEAD').decode().strip(), 'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                    'expectedCandidate': os.environ.get('SAHA_MISSING13_CANDIDATE'), 'inputs': inputs, 'dist': dist,
                    'compilerReceipts': receipts, 'baseline': baseline, 'gitStatus': git('status', '--porcelain=v1', '-z').decode(),
                    'limits': ['Dist hashes are observations; compiled bytes are not archived by this job.',
                               'Canonical runner restores tracked test evidence: these restored files are not current-run evidence.',
                               'Installer and generated fixture data differences require explicit applicability review.']}
          (out / (phase + '.json')).write_text(json.dumps(record, indent=2) + '\n')
          additions = {
              'integration/routine-save-status-browser', 'nfr/identity-numeric-dates',
              'smoke/handover-browser', 'smoke/programme-status-browser', 'smoke/resume-work-browser', 'smoke/task-entry-browser',
              'unit/capability-age-boundary-contract', 'unit/fact-author-effective-provenance-contract',
              'unit/frontline-followup-contract', 'unit/handover-contract', 'unit/identity-numeric-dates-contract',
              'unit/programme-status-contract', 'unit/resume-work-contract', 'unit/routine-save-status-contract',
              'unit/task-entry-contract',
              'smoke/deployment-evidence-review-browser', 'smoke/household-proxy-review-browser',
              'smoke/institution-roster-review-browser', 'smoke/interface-language-browser',
              'smoke/own-care-permissions-browser', 'smoke/programme-pack-review-browser',
              'smoke/selective-reuse-browser', 'smoke/service-authority-review-browser',
              'unit/deployment-evidence-review-contract', 'unit/household-proxy-review-contract',
              'unit/institution-roster-review-contract', 'unit/interface-language-contract',
              'unit/own-care-permissions-contract', 'unit/programme-pack-review-contract',
              'unit/selective-reuse-contract', 'unit/service-authority-review-contract',
              'smoke/amendments-browser', 'smoke/assistance-control-browser', 'smoke/fact-freshness-browser',
              'smoke/observation-time-browser', 'smoke/record-matching-browser', 'smoke/workforce-status-browser',
              'unit/amendments-contract', 'unit/assistance-control-contract', 'unit/fact-freshness-contract',
              'unit/observation-time-contract', 'unit/plan-review-contract', 'unit/record-matching-contract',
              'unit/routine-conflict-contract', 'unit/workforce-status-contract'
          }
          original = {name: value for name, value in baseline['suites'].items() if name not in additions}
          assert len(original) == 389, 'Original 389 guarded records must remain'
          assert hashlib.sha256(json.dumps(original,sort_keys=True,separators=(',',':')).encode()).hexdigest() == 'b404c185dfb475b4e4a0e2df28df4fa00e28a4ec50c762e40135eaff377ebc96', 'Original389 objects/minima changed'
          assert len(baseline['suites']) == 434 and additions <= baseline['suites'].keys(), 'All and only the 45 integrated observed minima must be added'
          if phase == 'final':
              before = json.loads((out / 'before-install.json').read_text())
              assert before['baseline'] == baseline, 'Original baseline changed'
              changes = {name: {'before': before['inputs'].get(name), 'after': inputs.get(name)}
                         for name in sorted(set(before['inputs']) | set(inputs)) if before['inputs'].get(name) != inputs.get(name)}
              (out / 'actual-input-differences.json').write_text(json.dumps(changes, indent=2) + '\n')
              def protected(name):
                  return (name.startswith(('app/', 'lib/', 'drizzle/', 'requirements/', 'scripts/')) or
                          (name.startswith('tests/') and not name.startswith(('tests/evidence/', 'tests/reports/')) and
                           not (name.count('/') == 1 and name.endswith('-result.json'))) or
                          name in ('package.json', 'pnpm-lock.yaml', 'vite.config.ts', '.github/workflows/ci.yml'))
              assert not [name for name in changes if protected(name)], 'Protected runtime/test/oracle inputs changed'
          print(json.dumps({'phase': phase, 'inputs': len(inputs), 'dist': len(dist), 'baselineRecords': len(baseline['suites'])}))
          PY
          python3 tests/reports/original-missing13-custody/capture.py before-install
      - name: Original pinned installation
        run: |
          npm run install:ci
      - name: Canonical current build
        run: |
          npm run build
      - name: Official project-pinned Chromium and legacy toolchain
        run: |
          node_modules/.bin/playwright install --with-deps chromium
          corepack enable pnpm
          test "$(pnpm --version)" = '11.25.0'
          node --input-type=module <<'JS'
          import {appendFileSync, readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {chromium} from '@playwright/test';
          const packageVersion = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version;
          if (packageVersion !== '1.56.1') throw new Error('Original pinned Playwright version changed');
