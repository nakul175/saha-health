# Slice 0c: engineering CI on synthetic data only. It never uses secrets, live providers,
# hosted databases or real patient records, and it does not deploy the Site.
name: engineering-checks
on:
  pull_request:
    # A pull request that changes only Markdown or docs/ does not start this suite.
    # Any other path still runs it, including the documentation integrity step.
    # workflow_dispatch always runs the full suite.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs before install and tests, which rewrite checkout-local files and result reports.
      - name: Documentation and requirements integrity
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      # Slice 11a: fails when a test file is not classified into a layer, or a *-smoke.mjs module is not imported by tests/api-smoke.mjs.
      - name: Test catalogue
        run: node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build
        run: npm run build
      - name: Supply-chain gate (SBOM and audit)
        run: node scripts/security-gate.mjs
      # Slice 11g (test review M7, H1): every suite runs through scripts/test.mjs. It builds the HTTP suite's local D1 in one
      # wrangler call (one process per migration failed 4 of 6 trials on a loaded machine), runs the restore drill on the
      # database the HTTP suite populated, and --guard fails when a suite disappears or reports fewer passed assertions than
      # tests/regression-baseline.json.
      - name: HTTP and database suite, restore drill
        run: node scripts/test.mjs integration resilience --only integration/run-api-smoke,resilience/recovery-drill --fast --guard
      # Slice 11a: the runner finds every unit suite itself, so a new suite is never left out of CI.
      - name: Unit suites
        run: node scripts/test.mjs unit --fast --guard
      - name: Install Chromium for app-first regressions
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: App-first workflow and scope regressions
        run: node scripts/test.mjs integration smoke ui --only integration/app-offline-review-browser,integration/app-offline-scope-browser,integration/touch-units-browser,integration/app-offline-browser,integration/service-identity-management,integration/reconciliation-http,integration/reminder-optout-http,integration/auxiliary-read-http,integration/workspace-metadata-smoke,integration/range-protocol-browser,integration/range-first-tap-browser,integration/import-unit-parity-browser,integration/offline-programme-browser,integration/delta-read-audit-http,integration/command-authority-http,integration/device-work-browser,integration/device-work-purge-failure-browser,integration/work-burden-http,integration/work-burden-browser,integration/work-burden-field-http,integration/work-burden-field-browser,integration/registration-device-browser,integration/work-burden-account-transition-review-browser,integration/registration-wire-receipt-http,integration/work-burden-ledger-http,integration/work-burden-ledger-browser,integration/work-burden-auth-first-http,integration/work-support-visibility-http,integration/offline-opens-auth-first-http,integration/offline-opens-http,integration/offline-opens-browser,integration/offline-open-account-binding-browser,integration/offline-open-unsent-pruning-browser,integration/work-burden-field-continuation-http,integration/work-burden-field-hooks-browser,integration/work-burden-field-identity-review,integration/work-burden-continuation-phone-review,integration/work-burden-continuation-adversarial-review,integration/clinical-source-http,integration/clinical-source-browser,integration/clinical-source-identity-http,integration/clinical-source-retrieval-http,integration/clinical-source-retrieval-browser,integration/clinical-source-dependency-http,ui/availability,smoke/app-back-browser,smoke/reconciliation-ui,smoke/reminder-optout-refresh-browser --fast --guard
      # Slices 11b and 11f: local smoke and the hosted smoke's self-test; the authorisation matrix over every GET route and role,
      # and identity hardening under Cloudflare Access; the UAT register check and the drift checks of the generated documents.
      - name: Smoke, security suites and UAT checks
        run: node scripts/test.mjs smoke nfr uat --only smoke/local-smoke,smoke/hosted-smoke,nfr/authorisation-matrix,nfr/identity-hardening,uat/check-uat-register,uat/generate-uat-pack,uat/coverage-map --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            tests/*-result.json
            tests/reports/
            dist/sbom.cdx.json
            dist/security-gate.json
