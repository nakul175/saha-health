# Slice 0c: engineering CI on synthetic data only. It never uses secrets, live providers,
# hosted databases or real patient records, and it does not deploy the Site.
name: engineering-checks
on:
  pull_request:
    # A pull request that changes only Markdown or docs/ does not start this suite.
    # Any other path still runs it, including the documentation integrity step.
    # workflow_dispatch always runs the full suite.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runs before install and tests, which rewrite checkout-local files and result reports.
      - name: Documentation and requirements integrity
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
      # Slice 11a: fails when a test file is not classified into a layer, or a *-smoke.mjs module is not imported by tests/api-smoke.mjs.
      - name: Test catalogue
        run: node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      # Wave 0 hygiene gates (8 October 2026). The lint ratchet compares the ESLint error count with .lint-baseline.json and
      # fails only when it rises; lower the baseline with `node scripts/lint-baseline.mjs --update` after fixing problems.
      # Both run through the package scripts (`npm run`, because install:ci puts pnpm behind corepack, not on PATH).
      - name: Lint (ratchet against .lint-baseline.json)
        run: npm run lint:baseline
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: D02 real synthetic Today journey
        run: |
          npx playwright install --with-deps chromium
          node scripts/test.mjs smoke --only smoke/today-browser --fast --guard
      - name: Supply-chain gate (SBOM and audit)
        run: node scripts/security-gate.mjs
      # Slice 11g (test review M7, H1): every suite runs through scripts/test.mjs. It builds the HTTP suite's local D1 in one
      # wrangler call (one process per migration failed 4 of 6 trials on a loaded machine), runs the restore drill on the
      # database the HTTP suite populated, and --guard fails when a suite disappears or reports fewer passed assertions than
      # tests/regression-baseline.json.
      - name: HTTP and database suite, restore drill
        run: node scripts/test.mjs integration resilience --only integration/run-api-smoke,resilience/recovery-drill --fast --guard
      # Slice 11a: the runner finds every unit suite itself, so a new suite is never left out of CI.
      - name: Unit suites
        run: node scripts/test.mjs unit --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            tests/*-result.json
            tests/reports/
            dist/sbom.cdx.json
            dist/security-gate.json

  # Split from `checks` on 6 October 2026: the browser regressions plus smoke selection no longer fit the 30-minute hosted limit
  # together with the unit and API layers. The selections, guards and baseline are unchanged; both jobs must pass.
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Install Chromium for app-first regressions
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: App-first workflow and scope regressions
        env:
          # These two household suites include a phone journey only with an explicit browser module.
          # CI must run the same counted journey as the integrated local regression gate.
          SAHA_BROWSER_PACKAGE: '@playwright/test'
        run: node scripts/test.mjs integration smoke ui --only integration/app-offline-review-browser,integration/app-offline-scope-browser,integration/touch-units-browser,integration/app-offline-browser,integration/service-identity-management,integration/reconciliation-http,integration/reminder-optout-http,integration/auxiliary-read-http,integration/workspace-metadata-smoke,integration/range-protocol-browser,integration/range-first-tap-browser,integration/import-unit-parity-browser,integration/offline-programme-browser,integration/delta-read-audit-http,integration/command-authority-http,integration/device-work-browser,integration/device-work-purge-failure-browser,integration/work-burden-http,integration/work-burden-browser,integration/work-burden-field-http,integration/work-burden-field-browser,integration/registration-device-browser,integration/work-burden-account-transition-review-browser,integration/registration-wire-receipt-http,integration/work-burden-ledger-http,integration/work-burden-ledger-browser,integration/work-burden-auth-first-http,integration/work-burden-transport-http,integration/work-support-visibility-http,integration/offline-opens-auth-first-http,integration/offline-opens-http,integration/offline-opens-browser,integration/offline-open-account-binding-browser,integration/offline-open-unsent-pruning-browser,integration/work-burden-field-continuation-http,integration/work-burden-field-hooks-browser,integration/work-burden-field-identity-review,integration/work-burden-continuation-phone-review,integration/work-burden-continuation-adversarial-review,integration/clinical-source-http,integration/clinical-source-browser,integration/clinical-source-identity-http,integration/clinical-source-retrieval-http,integration/clinical-source-retrieval-browser,integration/clinical-source-dependency-http,integration/offline-opens-transport-http,integration/household-reschedule-http,integration/household-reschedule-independent-http,integration/contact-import-http,integration/contact-import-independent-review,integration/mapping-lifecycle-http,integration/mapping-lifecycle-review-http,integration/mapping-lifecycle-browser,integration/mapping-lifecycle-review-browser,integration/indicator-governance-http,integration/indicator-governance-clock-http,integration/indicator-governance-browser,integration/indicator-governance-independent-http,integration/indicator-figures-http,integration/indicator-figures-edition-http,integration/indicator-figures-browser,integration/indicator-figures-submission-http,integration/indicator-figures-review-authority,integration/indicator-figures-review-submission,integration/inbound-conflicts-http,integration/inbound-conflicts-browser,integration/inbound-conflicts-pressure-repair,integration/inbound-conflicts-transport-http,integration/inbound-conflicts-independent-authority,integration/inbound-conflicts-independent-handoff,integration/household-completion-http,integration/household-completion-browser,integration/household-completion-independent-http,integration/household-completion-authority-review,integration/indicator-figures-submission-independent,integration/report-portability-http,integration/report-portability-after-http,integration/composite-measures-http,integration/composite-measures-browser,integration/composite-authority-repair-http,integration/composite-authority-independent-extra-http,integration/guided-home-browser,integration/inbound-retrieval-http,integration/inbound-retrieval-browser,integration/inbound-retrieval-service-repair-http,integration/inbound-retrieval-after-http,integration/inbound-retrieval-after-browser,integration/inbound-retrieval-original-race-after,integration/inbound-retrieval-service-independent-http,integration/mapping-conformance-http,integration/mapping-conformance-browser,integration/mapping-conformance-independent-http,integration/imported-evidence-http,integration/imported-evidence-browser,integration/imported-evidence-independent-http,integration/imported-evidence-independent-browser,ui/availability,smoke/app-back-browser,smoke/reconciliation-ui,smoke/reminder-optout-refresh-browser,integration/asha-guided-capture-browser,integration/asha-guided-capture-conditional,integration/asha-guided-capture-legacy-range,integration/asha-guided-capture-uncertainty,integration/figure-impact-browser,integration/figure-impact-http,integration/figure-impact-independent-extra-http,integration/guided-programme-reset-original-probe,integration/guided-programme-reset-variants,integration/guided-repair-independent-probe,integration/object-media-browser,integration/object-media-budget-http,integration/object-media-http,integration/object-media-independent-extra-http,integration/object-media-independent-storage-boundary,integration/object-media-legacy-regression,integration/object-media-migration,integration/object-media-native-boundary,integration/imported-media-independent-probe,integration/offline-guided-author-browser,integration/offline-sync-hash-repair-browser,integration/offline-sync-hash-device-browser,integration/offline-sync-hash-cold-extra-browser,integration/sync-receipt-cold-scope-browser,integration/programme-raw-key-http,integration/programme-raw-key-original-probe,integration/raw-key-independent-authority-http,integration/reporting-completeness-repaired-http,integration/reporting-completeness-repaired-browser,integration/reporting-completeness-repaired-account-browser,integration/completeness-cold-extra-authority-http,integration/completeness-cold-extra-browser,integration/installed-programme-execution-http,integration/installed-programme-execution-extra-http,integration/installed-programme-execution-browser,integration/verification-send-http,integration/verification-send-legacy-http,integration/verification-send-browser,integration/verification-send-extra-http,integration/verification-send-uncertainty-browser,integration/operational-privacy-http,integration/operational-privacy-adverse-http,integration/operational-privacy-browser,integration/operational-privacy-extra-http,integration/guided-registration-browser,integration/guided-registration-overflow-browser,integration/guided-registration-root-independent-browser --fast --guard
      # Slices 11b and 11f: local smoke and the hosted smoke's self-test; the authorisation matrix over every GET route and role,
      # and identity hardening under Cloudflare Access; the UAT register check and the drift checks of the generated documents.
      - name: Smoke, security suites and UAT checks
        run: node scripts/test.mjs smoke nfr uat --only smoke/local-smoke,smoke/hosted-smoke,nfr/authorisation-matrix,nfr/identity-hardening,uat/check-uat-register,uat/generate-uat-pack,uat/coverage-map --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-regression-evidence
          path: |
            tests/*-result.json
            tests/reports/
            dist/sbom.cdx.json
            dist/security-gate.json

  # Native security fixture executes independently even when another regression fails; no retries or deployment.
  native-authorization-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Documentation and test catalogue
        run: |
          python3 scripts/check-documentation.py
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build real current Worker
        run: npm run build
      - name: Original authorization matrix and unchanged minimum
        run: node scripts/test.mjs nfr --only nfr/authorisation-matrix --fast --guard --report tests/reports/native-authorization-current-summary.json
      - name: Original reporting calendar timing control
        run: node scripts/test.mjs integration --only integration/reporting-completeness-repaired-http --fast --guard --report tests/reports/reporting-calendar-current-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-authorization-current-evidence
          path: tests/reports/
