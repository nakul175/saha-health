      - name: Verify actual thirteen-suite coverage and unchanged source
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        run: |
          python3 tests/reports/original-missing13-custody/capture.py final
          python3 - <<'PY'
          import json, pathlib
          base = pathlib.Path('tests/reports/original-missing13-custody')
          contracts = [{'phase': 'remaining10', 'summary': 'tests/reports/original-missing13-remaining10-summary.json', 'ids': ['integration/alert-capture-ledger-http', 'integration/combined-reviewed-alert-export-cold-independent-http', 'integration/combined-reviewed-alert-recipient-hold-http', 'integration/combined-reviewed-guided-audio-independent-component', 'integration/combined-reviewed-programme-transition-audit-cold-extended-primary', 'integration/combined-reviewed-programme-transition-audit-cold-independent-http', 'integration/combined-reviewed-simplicity-independent-guided-instructions-browser', 'integration/combined-reviewed-simplicity-independent-guided-simplicity-browser', 'integration/combined-reviewed-transition-parity-cold-independent-http', 'integration/scheduled-local-check']}, {'phase': 'recipientHTTP', 'summary': 'tests/reports/original-missing13-recipient-http-summary.json', 'ids': ['integration/combined-reviewed-alert-recipient-current-http']}, {'phase': 'recipientScheduled', 'summary': 'tests/reports/original-missing13-recipient-scheduled-summary.json', 'ids': ['integration/combined-reviewed-alert-recipient-current-scheduled']}, {'phase': 'realPlaywright', 'summary': 'tests/reports/original-missing13-playwright-summary.json', 'ids': ['ui/playwright.config']}]
          baseline = json.loads(pathlib.Path('tests/regression-baseline.json').read_text())['suites']
          seen, findings, phases = [], [], []
          for contract in contracts:
              record = {'phase': contract['phase'], 'expectedIds': contract['ids']}
              try:
                  status = json.loads((base / (contract['phase'] + '-exit.json')).read_text())
                  summary = json.loads(pathlib.Path(contract['summary']).read_text())
                  suites = [r for r in summary['suites'] if r.get('kind') == 'suite']
                  ids = [r['id'] for r in suites]
                  record.update({'exit': status, 'summary': contract['summary'], 'ids': ids, 'guard': summary['guard']})
                  seen.extend(ids)
                  if sorted(ids) != sorted(contract['ids']) or len(ids) != len(set(ids)):
                      findings.append(contract['phase'] + ': exact original selection not executed')
                  if status['runnerExit'] != 0 or status['loggerExit'] != 0:
                      findings.append(contract['phase'] + ': actual phase or logger failed')
                  guard = summary['guard']
                  if not guard['ok'] or guard['evaluated'] != len(contract['ids']) or any(f.get('excused') for f in guard['findings']):
                      findings.append(contract['phase'] + ': original regression guard did not qualify all selected suites')
                  for suite in suites:
                      minimum = baseline[suite['id']]['minPassed']
                      if (suite['status'] != 'passed' or not isinstance(suite['passed'], int) or suite['passed'] < minimum or
                          suite.get('failed') not in (None, 0) or suite.get('skipped', 0) != 0):
                          findings.append(suite['id'] + ': actual status/count does not satisfy original minimum with no skips')
              except Exception as error:
                  record['failure'] = type(error).__name__ + ': ' + str(error)
                  findings.append(contract['phase'] + ': missing or invalid actual evidence')
              phases.append(record)
          expected = [i for c in contracts for i in c['ids']]
          if len(seen) != 13 or len(set(seen)) != 13 or sorted(seen) != sorted(expected):
              findings.append('Exact thirteen unique original suite outcomes are unavailable')
          report = {'schema': 1, 'expectedIds': expected, 'minimumSum': sum(baseline[i]['minPassed'] for i in expected),
                    'actualIds': seen, 'phases': phases, 'findings': findings, 'passed': not findings,
                    'limits': ['Counts derive from the original runner/guard, not restored historical observed files.',
                               'Known privacy/count conflict and screenshot failures remain failures; no policy/oracle waiver.',
                               'This CI coverage evidence is not formal UAT, physical-device or hosting acceptance.']}
          (base / 'coverage-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'suiteOutcomes': len(seen), 'minimumSum': report['minimumSum'], 'findings': findings}))
          raise SystemExit(0 if not findings else 1)
