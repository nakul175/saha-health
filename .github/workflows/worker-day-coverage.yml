name: worker-day-coverage
on:
  pull_request:
    paths:
      - 'tests/worker-day-contract.mjs'
      - 'tests/smoke/worker-day-browser.mjs'
      - '.github/workflows/worker-day-coverage.yml'
permissions:
  contents: read
concurrency:
  group: worker-day-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reconcile:
    if: github.repository == 'nakul175/saha-health' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/worker-day-2026-10-09'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Regenerate coverage without changing assertions or acceptance
        run: |
          set -euo pipefail
          node tests/uat/coverage-map.mjs
          node tests/uat/check-uat-register.mjs
          node tests/uat/coverage-map.mjs --check
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
          git add docs/testing/COVERAGE.md docs/testing/coverage.csv
          git diff --cached --stat
      - name: Publish generated documents to the same draft branch only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH='feat/worker-day-2026-10-09'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if git diff --cached --quiet; then echo 'Coverage already current'; exit 0; fi
          python3 - <<'PY'
          import subprocess
          allowed={'docs/testing/COVERAGE.md','docs/testing/coverage.csv'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual and actual <= allowed, actual
          PY
          gh auth setup-git
          REMOTE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile coverage for the worker-day tests'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Generated coverage commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Draft branch only. No main update, deployment, requirement status or test assertion changes.' >> "$GITHUB_STEP_SUMMARY"
