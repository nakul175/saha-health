name: testing-evidence-bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run install:ci
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: Install verified official k6 locally
        run: |
          mkdir -p "$RUNNER_TEMP/testing-k6"
          cd "$RUNNER_TEMP/testing-k6"
          curl --fail --location --proto '=https' -o k6-v2.3.0-linux-amd64.tar.gz https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          curl --fail --location --proto '=https' -o checksums.txt https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-checksums.txt
          awk '$2 == "k6-v2.3.0-linux-amd64.tar.gz" { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf k6-v2.3.0-linux-amd64.tar.gz
      - name: Run actual bounded synthetic reporting bridge
        run: node scripts/testing-links/run-bridge.mjs "$RUNNER_TEMP/testing-evidence" "$RUNNER_TEMP/testing-k6/k6-v2.3.0-linux-amd64/k6"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linked-testing-evidence
          path: ${{ runner.temp }}/testing-evidence/
          if-no-files-found: error
