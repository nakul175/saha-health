# Read-only steady-state gate. The one-time metadata blob helper is removed.
name: community-worker-entry
on:
  pull_request:
    paths:
      - 'public/worker-today/**'
      - 'tests/ui/worker-today.mjs'
      - '.github/workflows/community-worker-entry.yml'
permissions:
  contents: read
concurrency:
  group: community-worker-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Source, documentation, requirements and catalogue
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build and types
        run: |
          npm run typecheck
          npm run build
      - name: Install browser
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Read-only entry browser regression
        env:
          SAHA_BROWSER_PACKAGE: '@playwright/test'
          SAHA_EVIDENCE_DIR: /tmp/worker-today-evidence
        run: node scripts/test.mjs ui --only ui/worker-today --fast --guard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-today-test-evidence
          path: |
            /tmp/worker-today-evidence/
            tests/reports/
          retention-days: 7
