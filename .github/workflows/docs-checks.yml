# Slice 11g (test review H2): documentation, requirement, catalogue and UAT drift checks.
# Pull requests run these inside engineering-checks (`checks`), including documentation-only
# diffs, so this workflow no longer starts a second runner for the same commit.
# A manual run is still this short job: no build, no Worker, no secrets.
name: documentation-checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Before install, as in ci.yml: install rewrites checkout-local files that the documentation check pins.
      - name: Documentation, requirements and test catalogue
        run: |
          python3 scripts/check-documentation.py
          node scripts/audit-requirements.mjs --check
          node scripts/test.mjs --check-catalogue
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: UAT register and generated documents
        run: node scripts/test.mjs uat --fast
