name: scoped-permission-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  locality-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned dependencies
        run: npm run install:ci
      - name: Controlled containment failure tests
        run: node tests/scoped-locality-containment-contract.mjs
      - name: Fresh canonical build and contained native locality scenarios
        env:
          SAHA_TEST_PORT: '9436'
          SAHA_SCOPED_LOCALITY_RELEASE: root-scoped-locality-contract-reviewed-native-lane-released
        run: node tests/scoped-locality-native-current.mjs
      - name: Retain actual build, startup, response and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-locality-native-evidence
          path: tests/reports/scoped-locality*
          if-no-files-found: error
